<!DOCTYPE html>
<html>
<head><title>World Map Explorer</title></head>
<body>
<h1>World Map Explorer</h1>
<p>Click a region on the map to open information about a country.</p>
<img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg" alt="World Map" width="900" usemap="#worldmap">
<map name="worldmap">
    <area shape="circle" coords="170,260,45" href="https://en.wikipedia.org/wiki/United_States" alt="United States" target="_blank">
    <area shape="rect" coords="430,210,520,300" href="https://en.wikipedia.org/wiki/Europe" alt="Europe" target="_blank">
    <area shape="poly" coords="535,235,640,220,690,300,630,380,550,340" href="https://en.wikipedia.org/wiki/India" alt="India" target="_blank">
    <area shape="default" href="https://en.wikipedia.org/wiki/World" alt="Other world regions" target="_blank">
</map>
</body>
</html>
