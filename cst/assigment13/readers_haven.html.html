<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Readers' Haven – Book Registration &amp; Order Form</title></head>
<body>
<h1>Readers' Haven – Book Registration &amp; Order Form</h1>
<form action="#" method="post" target="_blank">
<label for="customerName">Customer Name:</label><br>
<input type="text" id="customerName" name="customerName" placeholder="Enter your full name" required><br><br>

<label for="email">Email Address:</label><br>
<input type="email" id="email" name="email" placeholder="Enter your email address" required><br><br>

<label for="mobile">Mobile Number:</label><br>
<input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required><br><br>

<label for="age">Age:</label><br>
<input type="number" id="age" name="age" min="1" max="120"><br><br>

<label for="password">Password:</label><br>
<input type="password" id="password" name="password" required><br><br>

<label for="deliveryDate">Delivery Date:</label><br>
<input type="date" id="deliveryDate" name="deliveryDate"><br><br>

<label for="deliveryTime">Preferred Delivery Time:</label><br>
<input type="time" id="deliveryTime" name="deliveryTime"><br><br>

<label for="category">Favorite Book Category:</label><br>
<select id="category" name="category" required>
<option value="">-- Select Category --</option><option>Fiction</option><option>Science</option>
<option>History</option><option>Children's Books</option>
</select><br><br>

<label for="bookTitle">Book Title:</label><br>
<input type="text" id="bookTitle" name="bookTitle" placeholder="Enter book title"><br><br>

<label for="quantity">Quantity:</label><br>
<input type="number" id="quantity" name="quantity" min="1" value="1"><br><br>

<label>Preferred Payment Method:</label><br>
<input type="radio" id="cod" name="payment" value="Cash on Delivery" required><label for="cod">Cash on Delivery</label>
<input type="radio" id="online" name="payment" value="Online Payment"><label for="online">Online Payment</label><br><br>

<label>Additional Services:</label><br>
<input type="checkbox" id="gift" name="services" value="Gift Wrapping"><label for="gift">Gift Wrapping</label>
<input type="checkbox" id="bookmark" name="services" value="Bookmark"><label for="bookmark">Bookmark</label>
<input type="checkbox" id="express" name="services" value="Express Delivery"><label for="express">Express Delivery</label>
<input type="checkbox" id="card" name="services" value="Greeting Card"><label for="card">Greeting Card</label><br><br>

<input type="hidden" name="formName" value="Readers Haven Book Order">

<label for="reference">Upload Reference Image/Document:</label><br>
<input type="file" id="reference" name="reference" accept="image/*,.pdf,.doc,.docx"><br><br>

<label for="address">Delivery Address:</label><br>
<textarea id="address" name="address" rows="5" cols="50" placeholder="Enter delivery address"></textarea><br><br>

<label for="instructions">Special Instructions:</label><br>
<textarea id="instructions" name="instructions" rows="5" cols="50" placeholder="Enter any special instructions"></textarea><br><br>

<button type="submit">Submit Order</button>
<button type="reset">Reset</button>
</form>
</body></html>
