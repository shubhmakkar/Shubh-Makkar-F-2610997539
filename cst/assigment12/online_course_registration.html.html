<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Online Course Registration</title></head>
<body>
<h1>Online Course Registration</h1>
<form action="#" method="post" target="_blank">
<label for="studentName">Student Name:</label><br>
<input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required><br><br>

<label for="email">Email Address:</label><br>
<input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

<label for="mobile">Mobile Number:</label><br>
<input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required><br><br>

<label for="age">Age:</label><br>
<input type="number" id="age" name="age" min="16" max="100"><br><br>

<label for="password">Password:</label><br>
<input type="password" id="password" name="password" placeholder="Create a password" required><br><br>

<label>Gender:</label><br>
<input type="radio" id="male" name="gender" value="Male" required><label for="male">Male</label>
<input type="radio" id="female" name="gender" value="Female"><label for="female">Female</label>
<input type="radio" id="other" name="gender" value="Other"><label for="other">Other</label><br><br>

<label>Skills:</label><br>
<input type="checkbox" id="html" name="skills" value="HTML"><label for="html">HTML</label>
<input type="checkbox" id="css" name="skills" value="CSS"><label for="css">CSS</label>
<input type="checkbox" id="js" name="skills" value="JavaScript"><label for="js">JavaScript</label>
<input type="checkbox" id="python" name="skills" value="Python"><label for="python">Python</label><br><br>

<label for="course">Course:</label><br>
<select id="course" name="course" required>
<option value="">-- Select Course --</option><option>Web Development</option><option>Python Programming</option>
<option>Data Analytics</option><option>Digital Marketing</option>
</select><br><br>

<input type="hidden" name="formName" value="Online Course Registration">

<label for="dob">Date of Birth:</label><br><input type="date" id="dob" name="dob"><br><br>
<label for="time">Preferred Class Time:</label><br><input type="time" id="time" name="time"><br><br>

<label for="address">Address / Additional Information:</label><br>
<textarea id="address" name="address" rows="6" cols="50" placeholder="Enter your address and additional information"></textarea><br><br>

<label for="document">Upload Document/Photograph:</label><br>
<input type="file" id="document" name="document" accept="image/*,.pdf,.doc,.docx"><br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>
</body></html>
